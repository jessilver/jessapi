name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1️⃣ Estágio de Compilação (Roda nos servidores do GitHub)
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Extrair Tags e Labels do Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,value=${{ github.sha }}

      - name: Compilar e Enviar Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2️⃣ Estágio de Deploy Automático (Roda na sua VPS através do runner jessapi-node)
  deploy:
    needs: build-and-push  # Só roda se o envio para o GHCR der certo
    runs-on: self-hosted   # Diz para rodar localmente na sua VPS Hetzner
    
    steps:
      - name: Checkout do código na VPS
        uses: actions/checkout@v4

      - name: Aplicar Manifestos do Kubernetes
        run: |
          # 🟢 Substitua pelo nome real do arquivo de manifesto do Node (ex: jessapi-deployment.yaml)
          kubectl apply -f jessapi-deployment.yaml

      - name: Forçar Atualização dos Containers (Rollout)
        run: |
          # 🟢 Substitua pelo nome (metadata.name) do Deployment do seu Node
          kubectl rollout restart deployment/jessapi-deployment