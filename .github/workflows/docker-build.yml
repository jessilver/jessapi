name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1️⃣ Estágio de Compilação (Roda nos servidores do GitHub)
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Extrair Tags e Labels do Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,value=${{ github.sha }}

      - name: Compilar e Enviar Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2️⃣ Estágio de Deploy Automático (Roda na sua VPS através do runner jessapi-node)
  deploy:
    needs: build-and-push
    runs-on: self-hosted   # Executa na sua VPS através do runner jessapi-node
    
    steps:
      - name: Checkout do código na VPS
        uses: actions/checkout@v4

      - name: Injetar Segredos e Aplicar Manifestos
        env:
          # Mapeia as variáveis exatamente com o mesmo nome dos marcadores ($CHAVE_...) do seu YAML
          CHAVE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CHAVE_API_KEY: ${{ secrets.API_KEY }}
        run: |
          # 🟢 Corrigido: Filtro adicionado para o envsubst não quebrar os metadados do Kubernetes do Node
          envsubst '$CHAVE_DATABASE_URL,$CHAVE_API_KEY' < jessapi-deployment.yaml > jessapi-deployment-ready.yaml

          # Aplica o manifesto gerado e atualizado no cluster
          kubectl apply -f jessapi-deployment-ready.yaml

      - name: Forçar Atualização dos Containers (Rollout)
        run: |
          kubectl rollout restart deployment/jessapi-deployment
